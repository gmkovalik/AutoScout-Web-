services:
  - type: web
    name: autoscout-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: PYTHON_VERSION
        value: 3.12.8
